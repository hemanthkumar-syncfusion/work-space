<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Data Grid</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { display: flex; justify-content: center; padding: 40px; background: #f4f6f8; }
    .grid-container { width: 720px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); overflow: hidden; }
    h2 { margin: 0; padding: 16px 20px; background: #1976d2; color: #fff; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e0e0e0; }
    th { background: #f0f4f8; color: #333; cursor: default; }
    tr:nth-child(even) { background: #fafafa; }
    tr:hover { background: #e8f0fe; }
    .pager { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; font-size: 13px; color: #555; }
    .pager .pages button {
      min-width: 30px; margin: 0 3px; padding: 6px 10px;
      border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer;
    }
    .pager .pages button:hover:not(:disabled) { background: #e8f0fe; border-color: #1976d2; }
    .pager .pages button.active { background: #1976d2; color: #fff; border-color: #1976d2; }
    .pager .pages button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="grid-container">
    <h2>Employee Data Grid</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Department</th><th>Designation</th><th>Salary</th>
        </tr>
      </thead>
      <tbody id="gridBody"></tbody>
    </table>
    <div class="pager">
      <span id="pageInfo"></span>
      <div class="pages" id="pageButtons"></div>
    </div>
  </div>

  <script>
    const data = [
      { id: 1,  name: "Alice Johnson",  department: "HR",          designation: "Manager",           salary: 75000 },
      { id: 2,  name: "Bob Smith",      department: "Engineering",  designation: "Senior Developer",  salary: 95000 },
      { id: 3,  name: "Carol White",    department: "Finance",      designation: "Analyst",           salary: 68000 },
      { id: 4,  name: "David Brown",    department: "Engineering",  designation: "Developer",        salary: 82000 },
      { id: 5,  name: "Emma Davis",     department: "Marketing",    designation: "Lead",              salary: 78000 },
      { id: 6,  name: "Frank Miller",   department: "Sales",        designation: "Executive",         salary: 61000 },
      { id: 7,  name: "Grace Wilson",   department: "Engineering",  designation: "QA Engineer",       salary: 70000 },
      { id: 8,  name: "Henry Moore",    department: "Finance",      designation: "Accountant",        salary: 66000 },
      { id: 9,  name: "Ivy Taylor",     department: "HR",           designation: "Recruiter",         salary: 58000 },
      { id: 10, name: "Jack Anderson",  department: "Marketing",    designation: "Coordinator",       salary: 54000 },
    ];

    const pageSize = 5;
    let currentPage = 1;
    const totalPages = Math.ceil(data.length / pageSize);

    function render() {
      const start = (currentPage - 1) * pageSize;
      const rows = data.slice(start, start + pageSize);

      document.getElementById("gridBody").innerHTML = rows.map(r => `
        <tr>
          <td>${r.id}</td><td>${r.name}</td><td>${r.department}</td>
          <td>${r.designation}</td><td>$${r.salary.toLocaleString()}</td>
        </tr>`).join("");

      document.getElementById("pageInfo").textContent =
        `Showing ${start + 1}-${start + rows.length} of ${data.length} records`;

      document.getElementById("pageButtons").innerHTML = `
        <button ${currentPage === 1 ? "disabled" : ""} data-page="prev">Prev</button>
        ${Array.from({ length: totalPages }, (_, i) =>
          `<button class="${i + 1 === currentPage ? "active" : ""}" data-page="${i + 1}">${i + 1}</button>`).join("")}
        <button ${currentPage === totalPages ? "disabled" : ""} data-page="next">Next</button>`;
    }

    document.getElementById("pageButtons").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn || btn.disabled) return;
      const p = btn.dataset.page;
      if (p === "prev") currentPage--;
      else if (p === "next") currentPage++;
      else currentPage = Number(p);
      render();
    });

    render();
  </script>
</body>
</html>
