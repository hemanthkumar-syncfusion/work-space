<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Syncfusion Data Grid with Paging</title>
  <!-- Syncfusion EJ2 styles -->
  <link href="https://cdn.syncfusion.com/ej2/28.1.33/material.css" rel="stylesheet" />
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; padding: 40px; background: #f4f6f8; }
    h2 { margin: 0 0 16px; color: #333; }
    #grid { max-width: 860px; }
  </style>
</head>
<body>
  <h2>Employee Data Grid</h2>
  <div id="grid"></div>

  <!-- Syncfusion EJ2 scripts -->
  <script src="https://cdn.syncfusion.com/ej2/28.1.33/dist/ej2.min.js"></script>
  <script>
    // Inject the Page module so paging methods/features work
    ej2.grids.Grid.Inject(ej2.grids.Page);

    // 10 records, 5 columns
    var employeeData = [
      { OrderID: 10248, Customer: 'VINET', City: 'Berlin',    Country: 'Germany',    Total: 32.38 },
      { OrderID: 10249, Customer: 'TOMSP', City: 'Madrid',    Country: 'Spain',     Total: 11.61 },
      { OrderID: 10250, Customer: 'HANAR', City: 'Lyon',      Country: 'France',    Total: 65.83 },
      { OrderID: 10251, Customer: 'VICTE', City: 'Rio',       Country: 'Brazil',    Total: 41.34 },
      { OrderID: 10252, Customer: 'SUPRD', City: 'Bern',      Country: 'Switzerland', Total: 51.30 },
      { OrderID: 10253, Customer: 'HANAR', City: 'Monza',    Country: 'Italy',     Total: 58.17 },
      { OrderID: 10254, Customer: 'CHOPS', City: 'Bern',      Country: 'Switzerland', Total: 22.98 },
      { OrderID: 10255, Customer: 'RICSU', City: 'Genève',   Country: 'Switzerland', Total: 148.33 },
      { OrderID: 10256, Customer: 'WELLI', City: 'Resende',  Country: 'Brazil',    Total: 13.97 },
      { OrderID: 10257, Customer: 'HILAA', City: 'San Cristóbal', Country: 'Venezuela', Total: 81.91 }
    ];

    var grid = new ej2.grids.Grid({
      dataSource: employeeData,
      columns: [
        { field: 'OrderID',  headerText: 'Order ID',  width: 120, textAlign: 'Right', type: 'number' },
        { field: 'Customer', headerText: 'Customer',  width: 130 },
        { field: 'City',     headerText: 'City',      width: 150 },
        { field: 'Country',  headerText: 'Country',   width: 150 },
        { field: 'Total',    headerText: 'Total',     width: 130, textAlign: 'Right', format: 'C2' }
      ],
      allowPaging: true,
      pageSettings: { pageSize: 5, pageSizes: [3, 5, 10] },
      allowSorting: true
    });

    grid.appendTo('#grid');
  </script>
</body>
</html>
